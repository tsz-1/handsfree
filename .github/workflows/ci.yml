name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries (OpenCV, MediaPipe, headless display for pyautogui)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 xvfb
      - run: pip install -e ".[dev]"
      - run: ruff check handsfree tools tests
      - run: xvfb-run -a pytest -q
