camera:
  index: 0          # Falls back to other indices if this one can't be opened
  width: 640
  height: 480
  mirror: true

tracker:
  model_path: models/hand_landmarker.task
  num_hands: 1
  min_detection_confidence: 0.8
  min_tracking_confidence: 0.5

mouse:
  # Fraction of the frame cropped on each side; the inner box maps to the whole screen.
  # Equal gain on both axes (~3.8 screen px per camera px on a 640x480 feed).
  margin_x: 0.15
  margin_y: 0.20
  # One Euro filter: lower min_cutoff = steadier when still; higher beta = less lag when moving fast.
  min_cutoff: 0.5
  beta: 0.005
  d_cutoff: 1.0
  click_rewind_s: 0.15   # Click where the cursor was this long ago, before the pinch pulled it
  reset_after_s: 0.5     # Restart smoothing if the hand was lost for this long

# Distances below are in palm sizes (wrist → middle-finger knuckle), so they don't
# change with how far the hand is from the camera.
gestures:
  pinch_enter: 0.30          # Fingertip gap that counts as a pinch
  pinch_exit: 0.40           # Gap needed to release; the gap between the two prevents flicker
  min_finger_extension: 1.2  # Pinching finger must be at least this far from the wrist (rejects fists)
  hold_s: 0.3                # Pinch longer than this starts a drag instead of a click
  scroll_deadzone: 0.15      # Hand offset ignored before scrolling starts
  scroll_speed: 40           # Lines/s per palm size beyond the dead zone; negative to invert
  scroll_grace_s: 0.3        # Keep the scroll anchor through posture/tracking glitches this long

ui:
  show_window: true
  always_on_top: true
