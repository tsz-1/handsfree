camera:
  index: 0          # Falls back to other indices if this one can't be opened
  width: 640
  height: 480
  mirror: true

tracker:
  model_path: models/hand_landmarker.task
  num_hands: 1
  min_detection_confidence: 0.8
  min_tracking_confidence: 0.5

mouse:
  # Fraction of the frame cropped on each side; the inner box maps to the whole screen.
  # Equal gain on both axes (~3.8 screen px per camera px on a 640x480 feed).
  margin_x: 0.15
  margin_y: 0.20
  # One Euro filter: lower min_cutoff = steadier when still; higher beta = less lag when moving fast.
  min_cutoff: 0.5
  beta: 0.005
  d_cutoff: 1.0
  click_rewind_s: 0.15   # Click where the cursor was this long ago, before the pinch pulled it
  reset_after_s: 0.5     # Restart smoothing if the hand was lost for this long

gestures:
  pinch_threshold_px: 50
  click_cooldown_s: 0.2

ui:
  show_window: true
  always_on_top: true
